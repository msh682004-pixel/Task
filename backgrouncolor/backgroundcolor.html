<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=devico-width,initial-scale=1.0">
       
  

    </head>
    <style>
        body{
  background-color: rgb(199, 194, 194);
  text-align: center;
  padding-top: 18%;
  display: flex;
  justify-content: center;
  margin-right: 30%;
        }

.box{
  width: 300px;
  background-color: rgb(255, 255, 255);
  padding:  35px;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0,18) ;
  margin-left: 45%;
  

 
  
}
button{
    width: 65px;
    height: 35px;
    margin: 10px;
    padding:5px;
    background-color: orange;
    color: white;
    font-size: 20px;
    
}
    </style>

    <body>
        <div class="box">

 <h2>تغير لون الخلفية</h2>

<button onclick="red()">أحمر</button>
<button onclick="blue()">أزرق</button>
<button onclick="green()">أخضر</button>
</div>

<script>
    function red(){
    document.body.style.backgroundColor="red";
}

function blue(){
    document.body.style.backgroundColor="blue";
}


function green(){
    document.body.style.backgroundColor="green";
}
</script>
 
 
    </body>
</html>
